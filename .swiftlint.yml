# Only lint the app's own source; skips graphify-out, Release, Mock Images, packages.
included:
  - Nightflyy

# SwiftUI modifier chains run long; 120 is too tight for them.
line_length:
  warning: 150
  error: 200
  ignores_urls: true

# "db" is the conventional name for a Firestore handle.
identifier_name:
  excluded:
    - id
    - db

# Named (icon, title, color) tuples are clear enough; no struct needed.
large_tuple:
  warning: 3
